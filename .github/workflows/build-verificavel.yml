# Build verificavel do cofre: compila na imagem Docker oficial da Solana (sempre o mesmo arquivo, byte a byte),
# mostra o hash, confere o contato de seguranca embutido e compara com o programa publicado na devnet.
name: Build verificavel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write # publicar o .so como versao (release) publica
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROGRAMA_DEVNET: E2zft5kPUBFgwbJYLSLMdx92TDT4Ajyddtczg3ByJ3XX
      IMAGEM: solanafoundation/solana-verifiable-build:2.1.21
      SOLANA_VERIFY: 0.5.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY }}
      - name: Instalar solana-verify
        run: command -v solana-verify || cargo install solana-verify --locked --version "$SOLANA_VERIFY"
      - name: Compilar (reproduzivel)
        run: solana-verify build --library-name cofre --base-image "$IMAGEM"
      - name: Hash, tamanho e contato de seguranca
        id: hash
        run: |
          HASH=$(solana-verify get-executable-hash target/deploy/cofre.so)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          # target/ e do root (criado pelo Docker): o resultado vai para saida/
          mkdir -p saida && cp target/deploy/cofre.so saida/ && echo "$HASH  cofre.so" > saida/cofre.so.sha256
          TAMANHO=$(stat -c %s target/deploy/cofre.so)
          grep -aq "BEGIN SECURITY.TXT V1" target/deploy/cofre.so || { echo "contato de seguranca nao encontrado no programa"; exit 1; }
          {
            echo "## Build verificavel"
            echo "- Hash do programa compilado: \`$HASH\`"
            echo "- Tamanho: $TAMANHO bytes"
            echo "- Contato de seguranca (security.txt) embutido: sim"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comparar com a devnet
        run: |
          REDE=$(solana-verify get-program-hash -u https://api.devnet.solana.com "$PROGRAMA_DEVNET" || echo "erro ao ler")
          if [ "$REDE" = "${{ steps.hash.outputs.hash }}" ]; then R="IGUAL: o programa da devnet e exatamente este codigo"; else R="diferente (a devnet ainda roda outra versao)"; fi
          echo "- Devnet (\`$PROGRAMA_DEVNET\`): \`$REDE\` → $R" >> "$GITHUB_STEP_SUMMARY"
          echo "$R"
      - uses: actions/upload-artifact@v4
        with:
          name: cofre-${{ github.sha }}
          path: saida/
      # O .so tambem fica numa versao publica (baixa sem login): e exatamente este arquivo que vai para a rede
      - name: Publicar o programa como versao (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_SHA::7}"
          NOTAS="Programa compilado pelo build verificavel (imagem $IMAGEM). Hash (solana-verify get-executable-hash): ${{ steps.hash.outputs.hash }}"
          gh release create "$TAG" saida/cofre.so saida/cofre.so.sha256 --target "$GITHUB_SHA" --title "Build verificavel $TAG" --notes "$NOTAS" \
            || gh release upload "$TAG" saida/cofre.so saida/cofre.so.sha256 --clobber
          echo "- Versao publica: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
