[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# Estouro numerico vira erro (a transacao falha) em vez de dar a volta
overflow-checks = true
lto = "fat"
codegen-units = 1
# Otimiza pelo TAMANHO: o deposito para manter o programa na rede e proporcional ao tamanho
opt-level = "z"
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
